services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      POLYGLOTTA_DB: /var/lib/polyglotta/polyglotta.sqlite3
      POLYGLOTTA_ANKI_SOCKET: /run/polyglotta/provision.sock
      POLYGLOTTA_ORIGIN: ${POLYGLOTTA_ORIGIN:-http://127.0.0.1:8000}
      POLYGLOTTA_ANKI_URL: ${POLYGLOTTA_ANKI_URL:-http://127.0.0.1:8081/}
    volumes:
      - journal:/var/lib/polyglotta
      - provisioning:/run/polyglotta:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12

  anki:
    platform: linux/amd64
    build:
      context: .
      target: anki
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      web:
        condition: service_healthy
    environment:
      POLYGLOTTA_DB: /var/lib/polyglotta/polyglotta.sqlite3
      POLYGLOTTA_ANKI_SOCKET: /run/polyglotta/provision.sock
      POLYGLOTTA_ANKI_DIR: /var/lib/anki
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - journal:/var/lib/polyglotta
      - provisioning:/run/polyglotta
      - collections:/var/lib/anki

  sync-proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - anki
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./deploy/compose-anki.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  journal:
  provisioning:
  collections:
