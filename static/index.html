<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163c33"><title>Polyglotta · Immersion journal</title><link rel="stylesheet" href="/static/style.css?v=settings"><script type="module" src="/static/app.js?v=settings"></script></head>
<body class="signed-out">
<section id="auth" aria-labelledby="auth-title">
  <h1>Polyglotta</h1><h2 id="auth-title">Sign in</h2>
  <form id="credentials" method="post" action="/api/auth/login">
    <label>Username<input name="username" autocomplete="username" required maxlength="64" pattern="[A-Za-z0-9_.\-]{1,64}"></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <small id="policy" hidden>Choose a username using letters, digits, dots, underscores or hyphens and a password of 15 to 128 characters.</small>
    <p class="error" role="alert"></p>
    <button class="primary">Sign in</button>
    <button type="button" id="auth-switch">Create account</button>
  </form>
</section>
<aside><a class="brand" href="#dashboard"><span class="brandmark">◒</span> Polyglotta</a><div class="navlabel">WORKSPACE</div><nav aria-label="Workspace"><a href="#dashboard" data-icon="grid">Dashboard</a><a href="#history" data-icon="history">Activity history</a><a href="#flashcards" data-icon="cards">Flashcards</a></nav><button class="profile" aria-haspopup="dialog"><span class="avatar">L</span><span><b>Learner</b><small>Account settings</small></span></button></aside>
<div class="workspace"><header><span class="breadcrumb">Workspace <i>/</i> <b id="crumb">Dashboard</b></span><div class="actions"><label class="switch"><span data-icon="globe"></span><select id="languages" aria-label="Active language"></select></label><button id="account">Account</button><button class="primary" id="log">＋ Log activity</button></div></header><main id="main"></main></div>
<dialog id="dialog"><div id="dialogBody"></div></dialog><div role="status" id="notice" hidden></div>
</body></html>
