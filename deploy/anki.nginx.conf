# Include inside the dedicated TLS server block for the Anki hostname.
location = /_polyglotta_anki_ready {
    internal;
    proxy_pass http://127.0.0.1:8000/api/anki/ready;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}
location / {
    auth_request /_polyglotta_anki_ready;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:8081;
}
